{% extends "base.html" %}

{% block content %}
<style>

/* ================= PAGE ================= */


.add-page{

    min-height:90vh;

    padding:60px 40px;


    background:


    radial-gradient(
    circle at top left,
    #2563eb,
    transparent 35%
    ),


    radial-gradient(
    circle at bottom right,
    #7c3aed,
    transparent 35%
    ),


    linear-gradient(
    135deg,
    #020617,
    #1e3a8a
    );


    border-radius:30px;


}



/* ================= CONTAINER ================= */


.add-container{


    max-width:650px;


    margin:auto;


    animation:

    pageShow .8s ease;


}



@keyframes pageShow{


from{

opacity:0;

transform:translateY(40px);

}


to{

opacity:1;

transform:translateY(0);

}


}





/* ================= CARD ================= */


.add-card{


    background:


    rgba(255,255,255,.10);



    backdrop-filter:blur(25px);



    padding:45px;



    border-radius:35px;



    border:


    1px solid rgba(255,255,255,.25);



    box-shadow:


    0 30px 70px rgba(0,0,0,.35);



    position:relative;



    overflow:hidden;



}




.add-card::before{


    content:"";


    position:absolute;


    width:250px;


    height:250px;



    right:-100px;


    top:-100px;



    background:


    linear-gradient(
    135deg,
    #38bdf8,
    #a855f7
    );



    border-radius:50%;



    opacity:.18;


}





/* ================= HEADER ================= */


.add-header{


    text-align:center;


    margin-bottom:40px;



    position:relative;


    z-index:2;


}



.add-header h1{


    font-size:42px;


    font-weight:900;



    background:


    linear-gradient(
    90deg,
    #ffffff,
    #60a5fa,
    #c084fc
    );



    background-clip:text;


    -webkit-background-clip:text;


    -webkit-text-fill-color:transparent;



    margin-bottom:12px;


}




.add-header p{


    color:#dbeafe;


    font-size:17px;


}







/* ================= FORM ================= */


.form-group{


    margin-bottom:25px;


    position:relative;


    z-index:2;


}





.form-group label{


    display:block;


    margin-bottom:10px;



    color:white;


    font-size:16px;


    font-weight:700;


}







/* ================= GLASS INPUT ================= */


.form-group input{


    width:100%;



    padding:16px 20px;



    border-radius:18px;



    border:


    1px solid rgba(255,255,255,.35);



    outline:none;



    font-size:16px;



    background:


    rgba(255,255,255,.15);



    backdrop-filter:blur(12px);



    color:white;



    transition:.35s;


}




.form-group input::placeholder{


    color:#cbd5e1;


}




.form-group input:focus{


    transform:


    translateY(-4px);



    background:


    rgba(255,255,255,.22);



    border-color:#38bdf8;



    box-shadow:


    0 0 25px rgba(56,189,248,.5);



}







/* ================= FILE INPUT ================= */


.file-input{


    padding:14px !important;


    background:


    rgba(255,255,255,.15) !important;



    color:white !important;


}





.file-input::file-selector-button{


    border:none;


    padding:10px 20px;


    margin-right:15px;



    border-radius:25px;



    background:


    linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
    );



    color:white;



    font-weight:700;



    cursor:pointer;



    transition:.3s;



}





.file-input::file-selector-button:hover{


    transform:scale(1.05);


}







/* ================= BUTTON ================= */


.add-btn{


    width:100%;



    padding:17px;



    border:none;



    border-radius:35px;



    background:


    linear-gradient(
    90deg,
    #2563eb,
    #7c3aed,
    #06b6d4
    );



    color:white;



    font-size:18px;



    font-weight:800;



    cursor:pointer;



    transition:.4s;



    box-shadow:


    0 15px 35px rgba(37,99,235,.35);



}





.add-btn:hover{


    transform:


    translateY(-6px)
    scale(1.03);



    box-shadow:


    0 25px 55px rgba(124,58,237,.55);



}







/* ================= BACK BUTTON ================= */


.back-btn{


    display:block;



    text-align:center;



    margin-top:25px;



    color:#bfdbfe;



    text-decoration:none;



    font-weight:700;



    transition:.3s;



}





.back-btn:hover{


    color:white;



    transform:


    translateX(-6px);


}







/* ================= MOBILE ================= */


@media(max-width:768px){


.add-page{


padding:30px 15px;


}



.add-card{


padding:30px 20px;


}



.add-header h1{


font-size:32px;


}


}



</style>
<div class="add-page">



<div class="add-container">



<div class="add-card">





<div class="add-header">


<h1>

➕ Add New Paper

</h1>


<p>

Upload previous year papers for students

</p>


</div>







<form method="POST" 
enctype="multipart/form-data">






<div class="form-group">

<label>
📄 Paper Title
</label>


<input

type="text"

name="title"

placeholder="Example: Java MSBTE Paper"

required>


</div>







<div class="form-group">

<label>
📅 Year
</label>


<input

type="text"

name="year"

placeholder="Example: 2025"

required>


</div>







<div class="form-group">

<label>
📁 Upload PDF
</label>


<input

class="file-input"

type="file"

name="paper_file"

accept=".pdf"

required>


</div>







<button

class="add-btn"

type="submit">


➕ Upload Paper


</button>




</form>






<a href="/admin"

class="back-btn">

⬅ Back to Admin Panel

</a>






</div>


</div>


</div>




{% endblock %}
