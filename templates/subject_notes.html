{% extends "base.html" %}

{% block content %}

<h2>
{{subject.icon}}
{{subject.name}}
</h2>

<hr>

{% for note in notes %}

<div class="card shadow mb-3">

<div class="card-body">

<h5>{{note.title}}</h5>

<a href="/note/{{note.id}}"
   class="btn btn-primary">

Read Note

</a>

</div>

</div>

{% endfor %}

{% endblock %}
