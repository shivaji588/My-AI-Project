{% extends "base.html" %}

{% block content %}

<style>

.manage-container{

    padding:50px;

    background:
    linear-gradient(135deg,#0f172a,#1e40af);

    min-height:90vh;

    border-radius:25px;

}


/* MAIN CARD */

.manage-card{

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(12px);

    padding:35px;

    border-radius:25px;

    color:white;

}



/* TITLE */

.manage-card h1{

    font-size:38px;

    margin-bottom:25px;

}




/* BUTTONS */

.btn{

    padding:10px 18px;

    border-radius:25px;

    text-decoration:none;

    color:white;

    font-weight:bold;

    display:inline-block;

    margin:5px;

    transition:.3s;

}


.btn:hover{

    transform:translateY(-3px);

}



.add{

    background:
    linear-gradient(90deg,#10b981,#06b6d4);

}



.edit{

    background:
    linear-gradient(90deg,#6366f1,#8b5cf6);

}



.delete{

    background:
    linear-gradient(90deg,#ef4444,#dc2626);

}





/* TABLE */


.table-box{

    overflow-x:auto;

}



table{

    width:100%;

    border-collapse:collapse;

    margin-top:25px;

}




th{

    background:#2563eb;

    padding:16px;

    text-align:center;

}



td{

    padding:16px;

    text-align:center;

    border-bottom:1px solid rgba(255,255,255,.2);

}




tr{

    transition:.3s;

}



tr:hover{

    background:rgba(255,255,255,.12);

}




/* FILE */

.file-name{

    color:#bfdbfe;

    font-weight:bold;

}



.pdf-icon{

    font-size:20px;

}



/* MOBILE */

@media(max-width:700px){

.manage-container{

padding:20px;

}


.manage-card{

padding:20px;

}


}


</style>





<div class="manage-container">



<div class="manage-card">



<h1>
⚙ Manage Papers
</h1>



<a href="/add_paper"
class="btn add">

➕ Add New Paper

</a>






<div class="table-box">


<table>


<tr>

<th>
ID
</th>

<th>
Title
</th>

<th>
Year
</th>

<th>
File
</th>

<th>
Action
</th>

</tr>




{% for paper in papers %}



<tr>


<td>

{{paper[0]}}

</td>



<td>

📄 {{paper[1]}}

</td>




<td>

<span class="file-name">

{{paper[2]}}

</span>

</td>




<td>


<span class="pdf-icon">

📎

</span>


{{paper[3]}}


</td>




<td>



<a href="/admin/edit/{{paper[0]}}"

class="btn edit">

✏ Edit

</a>




<a href="/admin/delete/{{paper[0]}}"

class="btn delete"

onclick="return confirm('Delete this paper?')">

🗑 Delete

</a>



</td>



</tr>




{% else %}



<tr>

<td colspan="5">

No Papers Added

</td>

</tr>



{% endfor %}





</table>


</div>



</div>


</div>


{% endblock %}
