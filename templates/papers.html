{% extends "base.html" %}

{% block content %}
<style>

/* ================= GLOBAL ================= */

.papers-page{

    min-height:100vh;

    padding:50px;


    background:

    radial-gradient(
    circle at top left,
    #2563eb,
    transparent 35%
    ),

    radial-gradient(
    circle at bottom right,
    #7c3aed,
    transparent 35%
    ),


    linear-gradient(
    135deg,
    #020617,
    #1e3a8a
    );


    border-radius:30px;

    color:white;

}



/* ================= HEADER ================= */


.papers-header{


    text-align:center;

    margin-bottom:40px;


}



.papers-header h1{


    font-size:48px;


    font-weight:900;


    background:


    linear-gradient(
    90deg,
    #38bdf8,
    #818cf8,
    #c084fc
    );


    -webkit-background-clip:text;


    -webkit-text-fill-color:transparent;


    letter-spacing:1px;


}




.papers-header p{


    color:#dbeafe;


    font-size:18px;


}







/* ================= FILTER ================= */


.filter-box{


    display:flex;


    justify-content:center;


    gap:20px;


    margin:40px 0;


    flex-wrap:wrap;


}





#searchInput,
#yearFilter{


    padding:16px 25px;


    border-radius:35px;


    border:


    1px solid rgba(255,255,255,.25);



    outline:none;


    background:


    rgba(255,255,255,.12);



    backdrop-filter:blur(15px);


    color:white;


    font-size:16px;



    transition:.3s;


}





#searchInput:focus,
#yearFilter:focus{


    transform:translateY(-3px);


    box-shadow:


    0 10px 30px rgba(96,165,250,.4);


}





#searchInput{


    width:45%;


}



#searchInput::placeholder{


    color:#cbd5e1;


}




#yearFilter option{


    color:#0f172a;


}








/* ================= PAPER LIST ================= */



.paper-row{


    display:flex;


    justify-content:space-between;


    align-items:center;


    padding:30px;



    margin-bottom:25px;



    background:


    rgba(255,255,255,.10);



    backdrop-filter:blur(20px);



    border-radius:30px;



    border:


    1px solid rgba(255,255,255,.18);



    border-left:


    6px solid #38bdf8;



    box-shadow:


    0 20px 40px rgba(0,0,0,.25);



    transition:.4s;


}




.paper-row:hover{


    transform:


    translateX(10px)
    translateY(-5px);



    box-shadow:


    0 30px 60px rgba(37,99,235,.35);


}





.paper-info{


    display:flex;


    align-items:center;


    gap:25px;


}





.year{


    min-width:80px;


    text-align:center;


    background:


    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );



    padding:14px 20px;


    border-radius:30px;


    font-weight:900;


    box-shadow:


    0 10px 25px rgba(6,182,212,.35);


}





.paper-info h3{


    margin:0;


    font-size:24px;


    color:white;


}




.paper-info p{


    margin-top:8px;


    color:#dbeafe;


}








/* ================= BUTTON ================= */



.btn{


    display:inline-flex;


    align-items:center;


    gap:8px;


    padding:12px 25px;



    border-radius:35px;



    color:white;


    text-decoration:none;


    font-weight:800;



    margin-left:10px;


    transition:.35s;


}




.view-btn{


    background:


    linear-gradient(
    135deg,
    #6366f1,
    #9333ea
    );


}




.download-btn{


    background:


    linear-gradient(
    135deg,
    #10b981,
    #06b6d4
    );


}




.btn:hover{


    transform:


    translateY(-5px)
    scale(1.05);



    box-shadow:


    0 20px 40px rgba(0,0,0,.25);


}








/* ================= BACK BUTTON ================= */


.back-btn{


    display:inline-flex;


    align-items:center;


    gap:8px;



    margin-top:40px;


    padding:14px 35px;



    border-radius:35px;



    background:


    linear-gradient(
    135deg,
    #475569,
    #1e293b
    );



    color:white;


    text-decoration:none;


    font-weight:800;



    transition:.3s;


}




.back-btn:hover{


    transform:


    translateY(-5px);


    box-shadow:


    0 20px 40px rgba(0,0,0,.3);


}








/* ================= MOBILE ================= */


@media(max-width:700px){


.papers-page{

padding:20px;

}



.papers-header h1{

font-size:34px;

}



.paper-row{


flex-direction:column;


gap:25px;


align-items:flex-start;


}



.paper-info{


flex-direction:column;


align-items:flex-start;


}



#searchInput{


width:90%;


}



.btn{


margin:5px 0;

}


}



</style>

<div class="papers-page">



<div class="papers-header">


<h1>
📄 Academic Papers
</h1>


<p>
Practice MSBTE previous papers and improve preparation
</p>


</div>






<!-- SEARCH -->


<div class="filter-box">


<input

type="text"

id="searchInput"

placeholder="🔍 Search Paper..."

onkeyup="filterPapers()"

>



<select id="yearFilter" onchange="filterPapers()">



<option value="all">
All Years
</option>


<option value="2025">
2025
</option>


<option value="2024">
2024
</option>


<option value="2023">
2023
</option>



</select>



</div>









<!-- DATABASE PAPERS -->


<div id="papersList">



{% for paper in papers %}



<div class="paper-row">



<div class="paper-info">



<span class="year">

{{paper[2]}}

</span>



<div>


<h3>

{{paper[1]}}

</h3>


<p>

MSBTE Previous Year Question Paper

</p>


</div>



</div>






<div>



<a href="/view_paper/{{paper[0]}}"

class="btn view-btn">

👁 View

</a>





<a href="/static/uploads/{{paper[3]}}"

download

class="btn download-btn">

⬇ Download

</a>



</div>




</div>



{% else %}


<h3 style="text-align:center">

No Papers Available

</h3>


{% endfor %}



</div>







<div style="text-align:center">


<a href="/subjects"

class="back-btn">

⬅ Back

</a>


</div>



</div>








<script>


function filterPapers(){


let input =
document.getElementById("searchInput")
.value
.toLowerCase();



let year =
document.getElementById("yearFilter")
.value;



let papers =
document.getElementsByClassName("paper-row");



for(let i=0;i<papers.length;i++){


let text =
papers[i].innerText.toLowerCase();



if(
text.includes(input)
&&
(year=="all" || text.includes(year))
){


papers[i].style.display="flex";


}

else{


papers[i].style.display="none";


}


}


}


</script>




{% endblock %}
