{% extends "base.html" %}

{% block content %}

<style>

.papers-page{

    padding:50px;

    color:white;

    background:
    linear-gradient(135deg,#1b3165,#2563eb);

    min-height:100vh;

    border-radius:20px;

}



/* HEADER */

.papers-header{

    text-align:center;

}


.papers-header h1{

    font-size:38px;

    font-weight:800;

}


.papers-header p{

    color:#dbeafe;

}





/* FILTER */

.filter-box{

    display:flex;

    justify-content:center;

    gap:20px;

    margin:35px 0;

    flex-wrap:wrap;

}



#searchInput,
#yearFilter{


    padding:14px 20px;

    border-radius:30px;

    border:none;

    outline:none;

    background:rgba(255,255,255,.15);

    color:white;

}



#searchInput{

    width:45%;

}



#searchInput::placeholder{

    color:#dbeafe;

}


#yearFilter option{

    color:black;

}





/* PAPER LIST */


.paper-row{


    display:flex;

    justify-content:space-between;

    align-items:center;


    padding:25px;


    margin-bottom:20px;


    background:
    rgba(255,255,255,.12);


    border-radius:18px;


    border-left:5px solid #38bdf8;


    transition:.3s;


}



.paper-row:hover{

    transform:translateX(8px);

    background:
    rgba(255,255,255,.18);

}





.paper-info{

    display:flex;

    align-items:center;

    gap:25px;

}



.year{


    background:
    linear-gradient(135deg,#2563eb,#06b6d4);


    padding:12px 18px;


    border-radius:25px;


    font-weight:bold;

}




.paper-info h3{

    margin:0;

    font-size:22px;

}



.paper-info p{

    margin-top:6px;

    color:#dbeafe;

}





/* BUTTON */


.btn{


    display:inline-block;

    padding:10px 20px;


    border-radius:25px;


    color:white;


    text-decoration:none;


    font-weight:bold;


    margin-left:8px;

}



.view-btn{

    background:
    linear-gradient(90deg,#6366f1,#8b5cf6);

}



.download-btn{

    background:
    linear-gradient(90deg,#10b981,#06b6d4);

}



.btn:hover{

    transform:translateY(-3px);

}




.back-btn{

    display:inline-block;

    margin-top:35px;

    padding:12px 25px;


    background:#475569;


    border-radius:25px;


    color:white;


    text-decoration:none;


    font-weight:bold;


}





@media(max-width:700px){


.paper-row{

flex-direction:column;

gap:20px;

align-items:flex-start;

}


.paper-info{

flex-direction:column;

align-items:flex-start;

}


#searchInput{

width:90%;

}

}


</style>





<div class="papers-page">



<div class="papers-header">


<h1>
📄 Academic Papers
</h1>


<p>
Practice MSBTE previous papers and improve preparation
</p>


</div>






<!-- SEARCH -->


<div class="filter-box">


<input

type="text"

id="searchInput"

placeholder="🔍 Search Paper..."

onkeyup="filterPapers()"

>



<select id="yearFilter" onchange="filterPapers()">



<option value="all">
All Years
</option>


<option value="2025">
2025
</option>


<option value="2024">
2024
</option>


<option value="2023">
2023
</option>



</select>



</div>









<!-- DATABASE PAPERS -->


<div id="papersList">



{% for paper in papers %}



<div class="paper-row">



<div class="paper-info">



<span class="year">

{{paper[2]}}

</span>



<div>


<h3>

{{paper[1]}}

</h3>


<p>

MSBTE Previous Year Question Paper

</p>


</div>



</div>






<div>



<a href="/view_paper/{{paper[0]}}"

class="btn view-btn">

👁 View

</a>





<a href="/static/uploads/{{paper[3]}}"

download

class="btn download-btn">

⬇ Download

</a>



</div>




</div>



{% else %}


<h3 style="text-align:center">

No Papers Available

</h3>


{% endfor %}



</div>







<div style="text-align:center">


<a href="/subjects"

class="back-btn">

⬅ Back

</a>


</div>



</div>








<script>


function filterPapers(){


let input =
document.getElementById("searchInput")
.value
.toLowerCase();



let year =
document.getElementById("yearFilter")
.value;



let papers =
document.getElementsByClassName("paper-row");



for(let i=0;i<papers.length;i++){


let text =
papers[i].innerText.toLowerCase();



if(
text.includes(input)
&&
(year=="all" || text.includes(year))
){


papers[i].style.display="flex";


}

else{


papers[i].style.display="none";


}


}


}


</script>




{% endblock %}
