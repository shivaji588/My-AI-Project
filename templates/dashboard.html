{% extends "base.html" %}

{% block content %}

<style>
.dashboard{
    text-align:center;
    padding:40px;
}

.card-container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    width:220px;
    padding:25px;
    background:#f5f5f5;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h3{
    color:#333;
}

.card a{
    text-decoration:none;
    background:#007bff;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

</style>


<div class="dashboard">

<h1>Welcome to AI Academic Copilot</h1>

<p>Your Learning Dashboard</p>


<div class="card-container">


<div class="card">
<h3>📚 Subjects</h3>
<p>Explore all subjects</p>
<a href="/subjects">Open</a>
</div>


<div class="card">
<h3>📝 Quiz</h3>
<p>Practice subject-wise quiz</p>
<a href="/quiz">Start</a>
</div>


<div class="card">
<h3>🤖 AI Chatbot</h3>
<p>Ask your doubts</p>
<a href="/chatbot">Chat</a>
</div>


<div class="card">
<h3>📊 Progress</h3>
<p>Check your performance</p>
<a href="/progress">View</a>
</div>


</div>

</div>


{% endblock %}
