{% extends "base.html" %}
{% block content %}

<style>
.subject-page{
    padding:50px;
    color:white;
    background:linear-gradient(135deg,#1b3165,#3b5cb4);
    min-height:100vh;
    border-radius:20px;
}

.card{
    background:rgba(218, 187, 187, 0.1);
    padding:25px;
    border-radius:15px;
    margin-top:20px;
}

li{
    margin:10px 0;
}
.back-btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 22px;
    background:linear-gradient(90deg,#2563eb,#8a999c);
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
    transition:0.3s ease;
}

/* hover effect */
.back-btn:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 10px 25px rgba(37,99,235,0.4);
}

/* animated shine effect */
.back-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
    );
    transition:0.5s;
}

.back-btn:hover::before{
    left:100%;
}

/* quiz button */
.quiz-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:linear-gradient(90deg,#10b981,#06b6d4);
    color:white;
    text-decoration:none;
    border-radius:25px;
    font-weight:bold;
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

.quiz-btn:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 10px 25px rgba(16,185,129,0.4);
}
</style>

<div class="subject-page">

    <h1>{{ subject.title }}</h1>
    <p>{{ subject.desc }}</p>

    <div class="card">
        <h3 style="color:white">📘 Notes</h3>
        <ul>
            {% for note in subject.notes %}
                <li>{{ note }}</li>
            {% endfor %}
            <a href="/subjects" class="back-btn">⬅️ Back to subjects</a>
            <a href="/{{ key }}_quiz" class="quiz-btn">🧠 Open Quiz</a>
        </ul>
    </div>

</div>

{% endblock %}
