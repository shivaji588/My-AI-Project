{% extends "base.html" %}

{% block content %}
<style>

/* ================= PAGE ================= */

.edit-page{

    min-height:100vh;

    padding:60px 30px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle at top left,#2563eb22,transparent 35%),
    radial-gradient(circle at bottom right,#9333ea22,transparent 35%),
    linear-gradient(135deg,#020617,#0f172a,#1e3a8a);

}

/* ================= CARD ================= */

.edit-card{

    width:100%;
    max-width:650px;

    position:relative;
    overflow:hidden;

    padding:45px;

    border-radius:35px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(28px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 30px 80px rgba(0,0,0,.35);

    animation:cardShow .8s ease;

}

.edit-card::before{

    content:"";

    position:absolute;

    width:240px;
    height:240px;

    top:-90px;
    right:-90px;

    border-radius:50%;

    background:
    linear-gradient(135deg,#2563eb,#9333ea);

    opacity:.18;

}

@keyframes cardShow{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ================= TITLE ================= */

.edit-card h1,
h1{

    text-align:center;

    margin-bottom:30px;

    font-size:38px;

    font-weight:900;

    background:
    linear-gradient(90deg,#ffffff,#60a5fa,#c084fc);

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

}

/* ================= LABEL ================= */

label{

    display:block;

    margin-bottom:8px;

    color:#f8fafc;

    font-size:15px;

    font-weight:700;

}

/* ================= INPUT ================= */

input{

    width:100%;

    height:56px;

    margin-bottom:22px;

    padding:0 18px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    outline:none;

    transition:.35s;

}

input::placeholder{

    color:#94a3b8;

}

input:focus{

    background:rgba(255,255,255,.12);

    border-color:#60a5fa;

    box-shadow:
    0 0 18px rgba(96,165,250,.35);

    transform:translateY(-2px);

}
/* ================= CURRENT FILE ================= */

.current-file{

    margin:20px 0 25px;

    padding:15px 18px;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    color:#e2e8f0;

    font-size:15px;

    font-weight:600;

}

.current-file b{

    color:#60a5fa;

    font-weight:800;

    word-break:break-all;

}/* ================= FILE INPUT ================= */

input[type="file"]{

    width:100%;

    padding:12px;

    margin-bottom:22px;

    border:2px dashed rgba(96,165,250,.45);

    border-radius:18px;

    background:rgba(255,255,255,.08);

    color:#e2e8f0;

    cursor:pointer;

    transition:.35s;

}

input[type="file"]:hover{

    border-color:#60a5fa;

    background:rgba(255,255,255,.12);

    box-shadow:
    0 10px 25px rgba(37,99,235,.25);

}

input[type="file"]::file-selector-button{

    padding:10px 18px;

    margin-right:15px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

    color:white;

    background:
    linear-gradient(135deg,#2563eb,#7c3aed);

    transition:.3s;

}

input[type="file"]::file-selector-button:hover{

    background:
    linear-gradient(135deg,#1d4ed8,#6d28d9);

}
/* ================= BUTTON ================= */

.update-btn{

    width:100%;

    height:58px;

    border:none;

    border-radius:35px;

    cursor:pointer;

    font-size:17px;

    font-weight:800;

    color:white;

    background:
    linear-gradient(135deg,#2563eb,#7c3aed,#06b6d4);

    background-size:250%;

    transition:.4s;

    box-shadow:
    0 18px 35px rgba(37,99,235,.35);

}

.update-btn:hover{

    background-position:right;

    transform:
    translateY(-5px)
    scale(1.02);

    box-shadow:
    0 25px 50px rgba(124,58,237,.45);

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

.edit-page{

padding:20px;

}

.edit-card{

padding:30px 22px;

}

.edit-card h1,
h1{

font-size:30px;

}

input{

height:52px;

}

.update-btn{

height:54px;

}

}

</style>

<div class="edit-page">


<div class="edit-card">


<h1>
✏ Edit Paper
</h1>



<form method="POST" enctype="multipart/form-data">



<label>
📄 Paper Title
</label>


<input

type="text"

name="title"

value="{{paper[1]}}"

required>




<label>
📅 Year
</label>


<input

type="text"

name="year"

value="{{paper[2]}}"

required>





<label>
📁 Replace PDF (Optional)
</label>


<input

type="file"

name="paper_file"

accept=".pdf">




<p class="current-file">
    📄 Current File:
    <b>{{ paper[3] }}</b>
</p>


<button class="update-btn">

💾 Update Paper

</button>


</form>


</div>


</div>



{% endblock %}
