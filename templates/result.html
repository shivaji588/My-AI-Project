{% extends "base.html" %}

{% block content %}

<style>
body{
    margin:0;
    font-family:Arial;
}

/* CENTER */
.result-container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:85vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

/* CARD */
.result-card{
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:white;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    width:360px;
    animation: pop 0.5s ease;
}

/* TITLE */
.result-card h1{
    font-size:26px;
    margin-bottom:10px;
}

/* SCORE */
.score{
    font-size:44px;
    font-weight:bold;
    margin:20px 0;
}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 25px;
    background:white;
    color:#007bff;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* SECOND BUTTON */
.leaderboard-btn{
    display:inline-block;
    margin-top:10px;
    padding:12px 25px;
    background:#111827;
    color:white;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.leaderboard-btn:hover{
    background:#000;
}

/* ANIMATION */
@keyframes pop{
    from {transform:scale(0.8); opacity:0;}
    to {transform:scale(1); opacity:1;}
}
</style>

<div class="result-container">

    <div class="result-card">

        <h1>🎉 Quiz Completed!</h1>

        <div class="score">
            {{ score }} / {{ total }}
        </div>

        <p>Keep practicing 🚀</p>

        <a href="/quiz" class="btn">Try Again</a>

        <br>

        <a href="/leaderboard" class="leaderboard-btn">🏆 View Leaderboard</a>

    </div>

</div>

{% endblock %}
