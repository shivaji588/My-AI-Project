{% extends "base.html" %}
{% block content %}

<style>

/* ================= MAIN PAGE ================= */
.view-container{
    padding:60px 20px;
    color:white;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    border-radius:25px;
    min-height:100vh;
}

/* ================= TITLE ================= */
.view-container h1{
    text-align:center;
    font-size:40px;
    font-weight:800;
    margin-bottom:10px;
}

.view-container p{
    text-align:center;
    color:#dbeafe;
    margin-bottom:30px;
}

/* ================= CARD ================= */
.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:30px;
    max-width:700px;
    margin:30px auto;
    border:1px solid rgba(255,255,255,0.15);
}

/* ================= LIST ================= */
.card ul{
    list-style:none;
    padding:0;
}

.card li{
    padding:12px;
    margin:10px 0;
    background:rgba(255,255,255,0.06);
    border-radius:12px;
    transition:0.3s;
}

.card li:hover{
    transform:translateX(5px);
    background:rgba(255,255,255,0.12);
}

/* ================= BACK BUTTON (PRO CLEAN VERSION) ================= */
.back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    margin-top:25px;
    padding:12px 24px;
    border-radius:30px;

    background:linear-gradient(90deg,#ef4444,#f97316);
    color:white;
    text-decoration:none;
    font-weight:600;

    transition:0.3s ease;
    box-shadow:0 6px 18px rgba(239,68,68,0.3);
}

/* hover */
.back-btn:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
}

/* click */
.back-btn:active{
    transform:scale(0.95);
}

/* shine animation */
.back-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
    transition:0.5s;
}

.back-btn:hover::before{
    left:100%;
}

.quiz-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    padding:12px 24px;
    border-radius:30px;

    background:linear-gradient(90deg,#2563eb,#06b6d4);
    color:white;
    text-decoration:none;
    font-weight:600;

    transition:0.3s ease;
    box-shadow:0 6px 18px rgba(37,99,235,0.3);
}

/* hover */
.quiz-btn:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
}

/* click */
.quiz-btn:active{
    transform:scale(0.95);
}

</style>

<div class="view-container">

    <h1>{{ data.title }}</h1>
    <p>📘 Complete Notes</p>

    <div class="card">

        <h3 style="margin-bottom:15px;">📚 Topics</h3>

        <ul>
            {% for n in data.notes %}
                <li>📌 {{ n }}</li>
            {% endfor %}
        </ul>

        <!-- BACK BUTTON -->
        <a href="/notes" class="back-btn"> ⬅ Back to Notes</a>

        <!-- QUIZ BUTTON -->
        <a href="/quiz" class="quiz-btn">🧠 Open Quiz</a>
    </a>

    </div>

</div>

{% endblock %}
