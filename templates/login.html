{% extends "base.html" %}

{% block content %}

<style>

.login-page{

    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;

    background:
    radial-gradient(circle at top left,#bfdbfe,#e0e7ff 35%),
    linear-gradient(135deg,#f8fafc,#dbeafe,#ede9fe);

}


.login-card{

    width:100%;
    max-width:450px;

    padding:40px;

    border-radius:30px;

    background:rgba(255,255,255,.75);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.6);

    box-shadow:0 25px 60px rgba(37,99,235,.18);

}



.login-icon{

    width:80px;
    height:80px;

    margin:auto;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:38px;

    background:
    linear-gradient(135deg,#2563eb,#7c3aed);

    color:white;

}



.login-card h2{

    text-align:center;

    margin-top:20px;

    font-size:34px;

    font-weight:800;

    color:#0f172a;

}



.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:30px;

}



.form-label{

    font-weight:600;

    color:#334155;

}



.form-control{

    height:50px;

    border-radius:15px;

    padding-left:18px;

    border:1px solid #cbd5e1;

}



.form-control:focus{

    border-color:#2563eb;

    box-shadow:0 0 0 4px rgba(37,99,blue,.15);

}



/* PASSWORD */

.password-box{

    position:relative;

}


.password-box .form-control{

    padding-right:55px;

}



.eye-btn{

    position:absolute;

    right:15px;

    top:10px;

    border:none;

    background:transparent;

    cursor:pointer;

    font-size:22px;

}




.login-btn{

    height:52px;

    border:none;

    border-radius:30px;

    background:
    linear-gradient(90deg,#2563eb,#7c3aed);

    color:white;

    font-weight:700;

    font-size:17px;

    transition:.3s;

}



.login-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 15px 30px rgba(37,99,235,.3);

}



.register-link{

    text-align:center;

    margin-top:25px;

    color:#64748b;

}


.register-link a{

    color:#2563eb;

    font-weight:700;

    text-decoration:none;

}


</style>



<div class="login-page">


<div class="login-card">



<div class="login-icon">
👤
</div>



<h2>
Welcome Back
</h2>


<p class="subtitle">
Login to AI Academic Copilot
</p>


<form method="POST">



<div class="mb-3">

<label class="form-label">

👤 Username

</label>


<input type="text"

class="form-control"

name="username"

placeholder="Enter your username"

required>

</div>





<div class="mb-4">

<label class="form-label">

🔒 Password

</label>



<div class="password-box">


<input type="password"

class="form-control"

id="loginPassword"

name="password"

placeholder="Enter your password"

required>



<button type="button"

class="eye-btn"

id="eyeBtn"

onclick="togglePassword()">

🔒

</button>



</div>


</div>





<button class="login-btn w-100">

Login

</button>



</form>






<div class="register-link">


Don't have an account?

<a href="{{ url_for('register') }}">

Register

</a>


</div>



</div>


</div>






<script>


function togglePassword(){


let password = document.getElementById("loginPassword");

let eye = document.getElementById("eyeBtn");



if(password.type === "password"){


password.type = "text";

eye.innerHTML = "🔓";


}

else{


password.type = "password";

eye.innerHTML = "🔒";


}


}


</script>



{% endblock %}
